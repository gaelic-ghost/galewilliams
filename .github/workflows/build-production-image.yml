name: Build Production Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galewilliams-production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: validate-tagged-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Confirm release tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch origin main --tags
          tag_commit=$(git rev-list -n 1 "$GITHUB_REF")
          git merge-base --is-ancestor "$tag_commit" origin/main
      - name: Run repository validation
        run: scripts/repo-maintenance/validate-all.sh
      - name: Install SwiftFormat
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.62.1/swiftformat_linux.zip \
            --output /tmp/swiftformat_linux.zip
          unzip -q -j /tmp/swiftformat_linux.zip -d /tmp/swiftformat
          sudo install -m 0755 /tmp/swiftformat/swiftformat_linux /usr/local/bin/swiftformat
          swiftformat --version
      - name: Check Swift formatting
        run: swiftformat Sources Tests --lint
      - name: Run Swift tests
        run: swift test

  build:
    name: build-linux-amd64-image
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux x86-64 production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: false
          outputs: type=docker,dest=/tmp/galewilliams-site.tar
          tags: galewilliams-site:${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      - name: Upload production image archive
        uses: actions/upload-artifact@v4
        with:
          name: galewilliams-site-linux-amd64
          path: /tmp/galewilliams-site.tar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy-tagged-release
    needs: build
    environment: production
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download production image archive
        uses: actions/download-artifact@v4
        with:
          name: galewilliams-site-linux-amd64
          path: /tmp/galewilliams-release
      - name: Configure restricted deployment key
        env:
          LIGHTSAIL_DEPLOY_KEY: ${{ secrets.LIGHTSAIL_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "$LIGHTSAIL_DEPLOY_KEY"
          umask 077
          printf '%s\n' "$LIGHTSAIL_DEPLOY_KEY" > /tmp/lightsail-deploy-key
      - name: Verify and transfer production image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          test -n "$LIGHTSAIL_HOST"
          archive=/tmp/galewilliams-release/galewilliams-site.tar
          checksum=$(sha256sum "$archive" | awk '{print $1}')
          ssh_options=(-i /tmp/lightsail-deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          scp "${ssh_options[@]}" "$archive" "ubuntu@$LIGHTSAIL_HOST:/tmp/galewilliams-site-$RELEASE_TAG.tar.partial"
          ssh "${ssh_options[@]}" "ubuntu@$LIGHTSAIL_HOST" "set -euo pipefail; test \"\$(sha256sum /tmp/galewilliams-site-$RELEASE_TAG.tar.partial | awk '{print \$1}')\" = '$checksum'; mv /tmp/galewilliams-site-$RELEASE_TAG.tar.partial /tmp/galewilliams-site-$RELEASE_TAG.tar"
      - name: Activate tagged production image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          LIGHTSAIL_HOST: ${{ vars.LIGHTSAIL_HOST }}
        run: |
          set -euo pipefail
          ssh_options=(-i /tmp/lightsail-deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          ssh "${ssh_options[@]}" "ubuntu@$LIGHTSAIL_HOST" "set -euo pipefail; cd /srv/galewilliams; sudo docker load -i /tmp/galewilliams-site-$RELEASE_TAG.tar; previous_tag=\$(sudo sed -n 's/^IMAGE_TAG=//p' .env | tail -n 1); : \${previous_tag:=v0.0.1}; if ! sudo IMAGE_TAG='$RELEASE_TAG' docker compose --env-file .env -f docker-compose.production.yml run --rm migrate; then echo 'Candidate migration failed. The running service tag was not changed.' >&2; exit 1; fi; if sudo grep -q '^IMAGE_TAG=' .env; then sudo sed -i -E 's/^IMAGE_TAG=.*/IMAGE_TAG=$RELEASE_TAG/' .env; else printf '\\nIMAGE_TAG=%s\\n' '$RELEASE_TAG' | sudo tee -a .env >/dev/null; fi; if ! sudo docker compose --env-file .env -f docker-compose.production.yml up -d --force-recreate app worker scheduler; then echo \"Runtime activation failed after migration. Restoring runtime services to \$previous_tag; schema changes are forward-only and require the release recovery runbook.\" >&2; sudo sed -i -E \"s/^IMAGE_TAG=.*/IMAGE_TAG=\$previous_tag/\" .env; sudo docker compose --env-file .env -f docker-compose.production.yml up -d --force-recreate app worker scheduler; exit 1; fi; curl --fail --silent --show-error http://127.0.0.1/api/health; curl --fail --silent --show-error http://127.0.0.1/api/ready; unlink /tmp/galewilliams-site-$RELEASE_TAG.tar"
