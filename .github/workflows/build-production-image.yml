name: Build Production Image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build-linux-amd64-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux x86-64 production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: false
          outputs: type=docker,dest=/tmp/galewilliams-site-v0.0.1.tar
          tags: galewilliams-site:v0.0.1
      - name: Upload production image archive
        uses: actions/upload-artifact@v4
        with:
          name: galewilliams-site-v0.0.1-linux-amd64
          path: /tmp/galewilliams-site-v0.0.1.tar
          if-no-files-found: error
          retention-days: 7
